<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ 反射弧测试 - 反应速度挑战</title>
    <style>
        :root {
            --bg: #1a1a2e;
            --surface: #16213e;
            --text: #e0e0e0;
            --text-secondary: #a0a0b8;
            --red: #ff3b30;
            --red-glow: #ff3b3066;
            --green: #34c759;
            --green-glow: #34c75966;
            --gold: #ffd60a;
            --blue: #5e9eff;
            --orange: #ff9f0a;
            --radius-lg: 160px;
            --radius-sm: 120px;
            --transition-fast: 0.12s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-smooth: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            background-image:
                radial-gradient(ellipse at 50% 30%, #1a1a3a 0%, #0d0d1a 70%),
                radial-gradient(ellipse at 20% 80%, #0f0f2a 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, #0f0f2a 0%, transparent 50%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            overflow-x: hidden;
            cursor: default;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 28px;
            padding: 20px;
            width: 100%;
            max-width: 520px;
        }

        /* 标题区域 */
        .header {
            text-align: center;
        }
        .header .icon {
            font-size: 42px;
            display: block;
            margin-bottom: 4px;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }
        .header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.02em;
            margin: 0;
            line-height: 1.2;
        }
        .header .subtitle {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 2px;
            letter-spacing: 0.04em;
        }

        /* 测试圆形 */
        .test-circle-wrapper {
            position: relative;
            width: calc(var(--radius-lg) * 2);
            height: calc(var(--radius-lg) * 2);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 脉冲环 */
        .pulse-ring {
            position: absolute;
            border-radius: 50%;
            border: 3px solid transparent;
            pointer-events: none;
            transition: all var(--transition-fast);
            opacity: 0;
        }
        .pulse-ring.ring-1 {
            width: calc(var(--radius-lg) * 2 + 24px);
            height: calc(var(--radius-lg) * 2 + 24px);
        }
        .pulse-ring.ring-2 {
            width: calc(var(--radius-lg) * 2 + 50px);
            height: calc(var(--radius-lg) * 2 + 50px);
        }
        .pulse-ring.ring-3 {
            width: calc(var(--radius-lg) * 2 + 80px);
            height: calc(var(--radius-lg) * 2 + 80px);
        }
        .pulse-ring.active {
            animation: pulseOut 0.7s ease-out forwards;
        }
        @keyframes pulseOut {
            0% {
                opacity: 0.9;
                transform: scale(1);
            }
            100% {
                opacity: 0;
                transform: scale(1.15);
            }
        }

        .test-circle {
            width: calc(var(--radius-lg) * 2);
            height: calc(var(--radius-lg) * 2);
            border-radius: 50%;
            background: var(--red);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background-color var(--transition-fast), box-shadow var(--transition-fast), transform var(--transition-fast);
            box-shadow:
                0 0 0 8px rgba(255, 59, 48, 0.15),
                0 0 60px rgba(255, 59, 48, 0.3),
                0 20px 50px rgba(0, 0, 0, 0.5),
                inset 0 2px 4px rgba(255, 255, 255, 0.15);
            position: relative;
            z-index: 1;
            will-change: background-color, box-shadow, transform;
        }
        .test-circle:active {
            transform: scale(0.96);
            transition: transform 0.08s ease;
        }

        /* 等待状态 - 红色 */
        .test-circle.state-waiting {
            background: #e8382d;
            box-shadow:
                0 0 0 8px rgba(255, 59, 48, 0.18),
                0 0 70px rgba(255, 59, 48, 0.4),
                0 20px 50px rgba(0, 0, 0, 0.5),
                inset 0 2px 4px rgba(255, 255, 255, 0.12);
            animation: breatheRed 2s ease-in-out infinite;
        }
        @keyframes breatheRed {
            0%,
            100% {
                box-shadow: 0 0 0 8px rgba(255, 59, 48, 0.18), 0 0 70px rgba(255, 59, 48, 0.4), 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 2px 4px rgba(255, 255, 255, 0.12);
            }
            50% {
                box-shadow: 0 0 0 14px rgba(255, 59, 48, 0.10), 0 0 90px rgba(255, 59, 48, 0.55), 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 2px 4px rgba(255, 255, 255, 0.18);
            }
        }

        /* 就绪状态 - 绿色 */
        .test-circle.state-ready {
            background: #2cc94a;
            box-shadow:
                0 0 0 8px rgba(52, 199, 89, 0.25),
                0 0 80px rgba(52, 199, 89, 0.5),
                0 0 140px rgba(52, 199, 89, 0.25),
                0 20px 50px rgba(0, 0, 0, 0.5),
                inset 0 2px 4px rgba(255, 255, 255, 0.2);
            animation: glowGreen 0.6s ease-in-out infinite;
            transform: scale(1.03);
        }
        @keyframes glowGreen {
            0%,
            100% {
                box-shadow: 0 0 0 8px rgba(52, 199, 89, 0.25), 0 0 80px rgba(52, 199, 89, 0.5), 0 0 140px rgba(52, 199, 89, 0.25), 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 2px 4px rgba(255, 255, 255, 0.2);
            }
            50% {
                box-shadow: 0 0 0 16px rgba(52, 199, 89, 0.15), 0 0 110px rgba(52, 199, 89, 0.7), 0 0 180px rgba(52, 199, 89, 0.35), 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 2px 4px rgba(255, 255, 255, 0.28);
            }
        }

        /* 结果状态 */
        .test-circle.state-result {
            background: #3a6fd8;
            box-shadow:
                0 0 0 8px rgba(94, 158, 255, 0.2),
                0 0 60px rgba(94, 158, 255, 0.35),
                0 20px 50px rgba(0, 0, 0, 0.5),
                inset 0 2px 4px rgba(255, 255, 255, 0.15);
            animation: none;
            transform: scale(1);
        }
        .test-circle.state-result.excellent {
            background: #2ecc71;
            box-shadow: 0 0 0 8px rgba(46, 204, 113, 0.3), 0 0 70px rgba(46, 204, 113, 0.5), 0 20px 50px rgba(0, 0, 0, 0.5);
        }
        .test-circle.state-result.good {
            background: #5e9eff;
            box-shadow: 0 0 0 8px rgba(94, 158, 255, 0.25), 0 0 60px rgba(94, 158, 255, 0.4), 0 20px 50px rgba(0, 0, 0, 0.5);
        }
        .test-circle.state-result.average {
            background: #ff9f0a;
            box-shadow: 0 0 0 8px rgba(255, 159, 10, 0.25), 0 0 60px rgba(255, 159, 10, 0.4), 0 20px 50px rgba(0, 0, 0, 0.5);
        }
        .test-circle.state-result.slow {
            background: #e8745c;
            box-shadow: 0 0 0 8px rgba(232, 116, 92, 0.25), 0 0 60px rgba(232, 116, 92, 0.35), 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        /* 过早点击 - 抖动 */
        .test-circle.state-too-early {
            background: #ff6b35;
            box-shadow: 0 0 0 8px rgba(255, 107, 53, 0.3), 0 0 80px rgba(255, 107, 53, 0.5), 0 20px 50px rgba(0, 0, 0, 0.5);
            animation: shake 0.5s ease-out;
            transform: scale(1);
        }
        @keyframes shake {
            0%,
            100% {
                transform: translateX(0);
            }
            10% {
                transform: translateX(-12px);
            }
            20% {
                transform: translateX(12px);
            }
            30% {
                transform: translateX(-10px);
            }
            40% {
                transform: translateX(10px);
            }
            50% {
                transform: translateX(-6px);
            }
            60% {
                transform: translateX(6px);
            }
            70% {
                transform: translateX(-3px);
            }
            80% {
                transform: translateX(3px);
            }
            90% {
                transform: translateX(-1px);
            }
        }

        /* 圆形内部文字 */
        .circle-text {
            text-align: center;
            color: #fff;
            pointer-events: none;
            transition: all var(--transition-fast);
            padding: 20px;
        }
        .circle-text .main-text {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 0.03em;
            display: block;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            line-height: 1.3;
        }
        .circle-text .sub-text {
            font-size: 0.8rem;
            font-weight: 500;
            opacity: 0.85;
            display: block;
            margin-top: 2px;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
        }
        .circle-text .time-display {
            font-size: 3.2rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            display: block;
            line-height: 1;
            text-shadow: 0 3px 12px rgba(0, 0, 0, 0.35);
        }
        .circle-text .time-unit {
            font-size: 1rem;
            font-weight: 500;
            opacity: 0.8;
            display: block;
            margin-top: 2px;
            letter-spacing: 0.06em;
        }

        /* 评价标签 */
        .rating-badge {
            display: inline-block;
            padding: 5px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            margin-top: 8px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        }

        /* 统计面板 */
        .stats-panel {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
        }
        .stat-card {
            background: var(--surface);
            border-radius: 16px;
            padding: 14px 20px;
            text-align: center;
            min-width: 80px;
            flex: 1;
            max-width: 130px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            transition: all var(--transition-smooth);
        }
        .stat-card:hover {
            border-color: rgba(255, 255, 255, 0.18);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
            transform: translateY(-2px);
        }
        .stat-card .stat-value {
            font-size: 1.6rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: -0.02em;
            line-height: 1.1;
        }
        .stat-card .stat-value.best {
            color: var(--gold);
        }
        .stat-card .stat-label {
            font-size: 0.72rem;
            color: var(--text-secondary);
            letter-spacing: 0.05em;
            margin-top: 4px;
            text-transform: uppercase;
        }

        /* 历史记录 */
        .history-bar {
            display: flex;
            gap: 6px;
            align-items: flex-end;
            height: 48px;
            padding: 0 4px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .history-dot {
            width: 8px;
            border-radius: 4px;
            transition: all var(--transition-smooth);
            min-width: 8px;
            cursor: default;
            position: relative;
        }
        .history-dot:hover::after {
            content: attr(data-time);
            position: absolute;
            bottom: 110%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 0.7rem;
            white-space: nowrap;
            pointer-events: none;
            z-index: 10;
        }
        .no-history {
            font-size: 0.78rem;
            color: var(--text-secondary);
            letter-spacing: 0.04em;
            opacity: 0.6;
        }

        /* 底部提示 */
        .hint-text {
            font-size: 0.78rem;
            color: var(--text-secondary);
            letter-spacing: 0.05em;
            text-align: center;
            opacity: 0.7;
            transition: opacity var(--transition-smooth);
        }
        .hint-text.warning {
            color: #ff6b35;
            opacity: 1;
            animation: blinkWarn 0.5s ease-in-out 3;
        }
        @keyframes blinkWarn {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.3;
            }
        }

        /* 响应式 */
        @media (max-width: 500px) {
            :root {
                --radius-lg: 120px;
                --radius-sm: 90px;
            }
            .test-circle-wrapper {
                width: calc(var(--radius-lg) * 2);
                height: calc(var(--radius-lg) * 2);
            }
            .test-circle {
                width: calc(var(--radius-lg) * 2);
                height: calc(var(--radius-lg) * 2);
            }
            .circle-text .main-text {
                font-size: 1.1rem;
            }
            .circle-text .time-display {
                font-size: 2.5rem;
            }
            .circle-text .sub-text {
                font-size: 0.7rem;
            }
            .header h1 {
                font-size: 1.4rem;
            }
            .header .icon {
                font-size: 32px;
            }
            .stat-card {
                padding: 10px 14px;
                min-width: 60px;
                border-radius: 12px;
            }
            .stat-card .stat-value {
                font-size: 1.3rem;
            }
            .stat-card .stat-label {
                font-size: 0.65rem;
            }
            .stats-panel {
                gap: 8px;
            }
            .container {
                gap: 20px;
                padding: 16px;
            }
        }
        @media (max-width: 360px) {
            :root {
                --radius-lg: 100px;
                --radius-sm: 75px;
            }
            .circle-text .main-text {
                font-size: 0.95rem;
            }
            .circle-text .time-display {
                font-size: 2rem;
            }
            .circle-text .sub-text {
                font-size: 0.65rem;
            }
            .circle-text .time-unit {
                font-size: 0.75rem;
            }
            .stat-card {
                padding: 8px 10px;
                min-width: 50px;
                border-radius: 10px;
            }
            .stat-card .stat-value {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 标题 -->
        <div class="header">
            <span class="icon">⚡</span>
            <h1>反射弧测试</h1>
            <p class="subtitle">REACTION TIME TEST</p>
        </div>

        <!-- 测试圆形 -->
        <div class="test-circle-wrapper" id="circleWrapper">
            <div class="pulse-ring ring-1" id="ring1"></div>
            <div class="pulse-ring ring-2" id="ring2"></div>
            <div class="pulse-ring ring-3" id="ring3"></div>
            <div class="test-circle state-waiting" id="testCircle">
                <div class="circle-text" id="circleText">
                    <span class="main-text">等待绿色</span>
                    <span class="sub-text">做好准备...</span>
                </div>
            </div>
        </div>

        <!-- 提示文字 -->
        <p class="hint-text" id="hintText">屏幕变绿时立即点击圆形</p>

        <!-- 统计面板 -->
        <div class="stats-panel">
            <div class="stat-card">
                <div class="stat-value" id="statAttempts">0</div>
                <div class="stat-label">尝试次数</div>
            </div>
            <div class="stat-card">
                <div class="stat-value best" id="statBest">--</div>
                <div class="stat-label">最佳成绩</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="statAvg">--</div>
                <div class="stat-label">平均时间</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="statLatest">--</div>
                <div class="stat-label">最近成绩</div>
            </div>
        </div>

        <!-- 历史记录条 -->
        <div class="history-bar" id="historyBar">
            <span class="no-history">尚无记录 — 点击圆形开始测试</span>
        </div>
    </div>

    <script>
        (function() {
            // ============ DOM 元素 ============
            const testCircle = document.getElementById('testCircle');
            const circleText = document.getElementById('circleText');
            const circleWrapper = document.getElementById('circleWrapper');
            const hintText = document.getElementById('hintText');
            const ring1 = document.getElementById('ring1');
            const ring2 = document.getElementById('ring2');
            const ring3 = document.getElementById('ring3');
            const historyBar = document.getElementById('historyBar');

            const statAttempts = document.getElementById('statAttempts');
            const statBest = document.getElementById('statBest');
            const statAvg = document.getElementById('statAvg');
            const statLatest = document.getElementById('statLatest');

            // ============ 状态变量 ============
            const STATE = {
                WAITING: 'waiting', // 红色等待中
                READY: 'ready', // 绿色就绪
                RESULT: 'result', // 显示结果
                TOO_EARLY: 'too_early', // 过早点击
            };

            let currentState = STATE.WAITING;
            let waitingTimer = null;
            let readyTimestamp = null;
            let resultTimeout = null;
            let tooEarlyTimeout = null;
            let isTransitioning = false; // 防止快速重复触发

            // 统计数据
            let reactionTimes = []; // 所有有效反应时间（毫秒）
            const MAX_HISTORY = 30; // 最多保存30条记录
            const HISTORY_DISPLAY = 12; // 显示最近12条

            // 时间范围（毫秒）
            const MIN_WAIT = 1500;
            const MAX_WAIT = 5000;
            const RESULT_DISPLAY_DURATION = 2500;
            const TOO_EARLY_DISPLAY_DURATION = 1500;

            // ============ 工具函数 ============
            function getRandomWaitTime() {
                return Math.floor(Math.random() * (MAX_WAIT - MIN_WAIT + 1)) + MIN_WAIT;
            }

            function formatTime(ms) {
                if (ms === null || ms === undefined) return '--';
                return Math.round(ms) + ' ms';
            }

            function getRating(ms) {
                if (ms < 150) return { label: '⚡ 闪电反应', class: 'excellent', color: '#2ecc71' };
                if (ms < 230) return { label: '👏 非常优秀', class: 'excellent', color: '#2ecc71' };
                if (ms < 320) return { label: '👍 反应良好', class: 'good', color: '#5e9eff' };
                if (ms < 500) return { label: '🙂 正常范围', class: 'average', color: '#ff9f0a' };
                if (ms < 800) return { label: '🐢 稍显迟缓', class: 'slow', color: '#e8745c' };
                return { label: '💤 需要练习', class: 'slow', color: '#e8745c' };
            }

            function getHistoryBarHeight(ms) {
                // 将反应时间映射到条形高度（8px - 44px）
                const minH = 8;
                const maxH = 44;
                const minMs = 100;
                const maxMs = 900;
                const clamped = Math.max(minMs, Math.min(maxMs, ms));
                const ratio = (clamped - minMs) / (maxMs - minMs);
                // 反转：反应越快（ms越小），条形越高
                return Math.round(maxH - ratio * (maxH - minH));
            }

            function getHistoryBarColor(ms) {
                if (ms < 200) return '#34c759';
                if (ms < 300) return '#5e9eff';
                if (ms < 500) return '#ff9f0a';
                return '#e8745c';
            }

            // ============ UI 更新 ============
            function updateCircleUI(state, extraClass = '') {
                // 移除所有状态类
                testCircle.classList.remove('state-waiting', 'state-ready', 'state-result',
                    'state-too-early', 'excellent', 'good', 'average', 'slow');
                // 添加对应状态类
                testCircle.classList.add('state-' + state);
                if (extraClass && state === STATE.RESULT) {
                    testCircle.classList.add(extraClass);
                }
                // 重置transform（除了ready状态）
                if (state !== STATE.READY) {
                    testCircle.style.transform = '';
                }
            }

            function updateCircleContent(html) {
                circleText.innerHTML = html;
            }

            function updateHint(text, isWarning = false) {
                hintText.textContent = text;
                hintText.classList.toggle('warning', isWarning);
            }

            function triggerPulseRings() {
                [ring1, ring2, ring3].forEach((ring, i) => {
                    ring.classList.remove('active');
                    void ring.offsetWidth; // 强制回流以重新触发动画
                    setTimeout(() => {
                        ring.classList.add('active');
                    }, i * 60);
                });
            }

            function updateStatsPanel() {
                const count = reactionTimes.length;
                statAttempts.textContent = count;

                if (count > 0) {
                    const best = Math.min(...reactionTimes);
                    const avg = Math.round(reactionTimes.reduce((a, b) => a + b, 0) / count);
                    const latest = reactionTimes[count - 1];

                    statBest.textContent = formatTime(best);
                    statAvg.textContent = formatTime(avg);
                    statLatest.textContent = formatTime(latest);
                } else {
                    statBest.textContent = '--';
                    statAvg.textContent = '--';
                    statLatest.textContent = '--';
                }
            }

            function updateHistoryBar() {
                historyBar.innerHTML = '';

                if (reactionTimes.length === 0) {
                    historyBar.innerHTML = '<span class="no-history">尚无记录 — 点击圆形开始测试</span>';
                    return;
                }

                const recent = reactionTimes.slice(-HISTORY_DISPLAY);
                recent.forEach((ms, index) => {
                    const dot = document.createElement('div');
                    dot.className = 'history-dot';
                    const height = getHistoryBarHeight(ms);
                    const color = getHistoryBarColor(ms);
                    dot.style.height = height + 'px';
                    dot.style.backgroundColor = color;
                    dot.style.boxShadow = `0 0 8px ${color}44`;
                    dot.setAttribute('data-time', formatTime(ms));
                    dot.title = `第${reactionTimes.length - recent.length + index + 1}次: ${formatTime(ms)}`;
                    historyBar.appendChild(dot);
                });

                if (reactionTimes.length > HISTORY_DISPLAY) {
                    const more = document.createElement('span');
                    more.style.cssText = `
                            font-size: 0.7rem;
                            color: var(--text-secondary);
                            margin-left: 6px;
                            opacity: 0.6;
                            align-self: center;
                        `;
                    more.textContent = `+${reactionTimes.length - HISTORY_DISPLAY}条`;
                    historyBar.appendChild(more);
                }
            }

            function updateAllStats() {
                updateStatsPanel();
                updateHistoryBar();
            }

            // ============ 核心逻辑 ============
            function startWaiting() {
                // 清理所有计时器
                clearAllTimers();

                currentState = STATE.WAITING;
                isTransitioning = false;

                // 更新UI
                updateCircleUI(STATE.WAITING);
                updateCircleContent(`
                        <span class="main-text">等待绿色</span>
                        <span class="sub-text">做好准备...</span>
                    `);
                updateHint('屏幕变绿时立即点击圆形');

                // 设置随机等待计时器
                const waitTime = getRandomWaitTime();
                waitingTimer = setTimeout(() => {
                    transitionToReady();
                }, waitTime);
            }

            function transitionToReady() {
                if (currentState !== STATE.WAITING) return;

                currentState = STATE.READY;
                readyTimestamp = performance.now();

                // 更新UI - 绿色就绪
                updateCircleUI(STATE.READY);
                updateCircleContent(`
                        <span class="main-text" style="font-size:1.6rem;">点击！</span>
                        <span class="sub-text">快！</span>
                    `);
                updateHint('⚡ 现在点击！', false);
                triggerPulseRings();

                // 设置超时（如果用户长时间不点击）
                resultTimeout = setTimeout(() => {
                    if (currentState === STATE.READY) {
                        // 用户错过了，自动重置
                        updateHint('⏰ 超时了，重新开始...', true);
                        currentState = STATE.RESULT;
                        updateCircleUI(STATE.RESULT, 'slow');
                        updateCircleContent(`
                                <span class="main-text">超时</span>
                                <span class="sub-text">请重新尝试</span>
                            `);
                        setTimeout(() => {
                            startWaiting();
                        }, 1800);
                    }
                }, 10000); // 10秒超时
            }

            function handleUserReaction() {
                if (isTransitioning) return;

                const clickTimestamp = performance.now();

                if (currentState === STATE.WAITING) {
                    // 过早点击！
                    handleTooEarly();
                } else if (currentState === STATE.READY) {
                    // 有效反应！
                    handleValidReaction(clickTimestamp);
                } else if (currentState === STATE.RESULT || currentState === STATE.TOO_EARLY) {
                    // 在结果展示期间点击，提前开始新一轮
                    if (currentState === STATE.RESULT) {
                        clearAllTimers();
                        startWaiting();
                    } else if (currentState === STATE.TOO_EARLY) {
                        clearAllTimers();
                        startWaiting();
                    }
                }
            }

            function handleTooEarly() {
                isTransitioning = true;
                clearAllTimers();
                currentState = STATE.TOO_EARLY;

                updateCircleUI(STATE.TOO_EARLY);
                updateCircleContent(`
                        <span class="main-text" style="color:#fff;">太早了！</span>
                        <span class="sub-text">请等待绿色出现</span>
                    `);
                updateHint('⚠️ 请在屏幕变绿后再点击！', true);
                triggerPulseRings();

                tooEarlyTimeout = setTimeout(() => {
                    isTransitioning = false;
                    startWaiting();
                }, TOO_EARLY_DISPLAY_DURATION);
            }

            function handleValidReaction(clickTimestamp) {
                isTransitioning = true;
                clearAllTimers();

                const reactionTime = clickTimestamp - readyTimestamp;
                currentState = STATE.RESULT;

                // 记录成绩
                reactionTimes.push(reactionTime);
                if (reactionTimes.length > MAX_HISTORY) {
                    reactionTimes.shift();
                }

                // 获取评价
                const rating = getRating(reactionTime);

                // 更新UI
                updateCircleUI(STATE.RESULT, rating.class);
                updateCircleContent(`
                        <span class="time-display">${Math.round(reactionTime)}</span>
                        <span class="time-unit">毫秒</span>
                        <span class="rating-badge">${rating.label}</span>
                    `);
                updateHint(`反应时间: ${formatTime(reactionTime)} — 点击可重新测试`);
                triggerPulseRings();
                updateAllStats();

                // 自动重置
                resultTimeout = setTimeout(() => {
                    isTransitioning = false;
                    startWaiting();
                }, RESULT_DISPLAY_DURATION);
            }

            function clearAllTimers() {
                if (waitingTimer) {
                    clearTimeout(waitingTimer);
                    waitingTimer = null;
                }
                if (resultTimeout) {
                    clearTimeout(resultTimeout);
                    resultTimeout = null;
                }
                if (tooEarlyTimeout) {
                    clearTimeout(tooEarlyTimeout);
                    tooEarlyTimeout = null;
                }
            }

            // ============ 事件监听 ============
            function onPointerDown(e) {
                // 检查是否点击在测试圆形上（或移动端任意位置）
                const target = e.target;
                const isOnCircle = testCircle.contains(target) || target === testCircle || circleWrapper
                    .contains(target);

                if (isOnCircle) {
                    e.preventDefault();
                    handleUserReaction();
                }
            }

            // 使用 pointerdown 统一处理鼠标和触摸
            testCircle.addEventListener('pointerdown', onPointerDown);
            circleWrapper.addEventListener('pointerdown', function(e) {
                if (e.target === circleWrapper || e.target.classList.contains('pulse-ring')) {
                    e.preventDefault();
                    handleUserReaction();
                }
            });

            // 也监听整个body以便在移动端更容易触发
            document.addEventListener('pointerdown', function(e) {
                const isOnCircle = testCircle.contains(e.target) ||
                    circleWrapper.contains(e.target) ||
                    e.target === testCircle ||
                    e.target === circleWrapper;

                if (isOnCircle && !e.defaultPrevented) {
                    e.preventDefault();
                    handleUserReaction();
                }
            });

            // 防止双击选中
            testCircle.addEventListener('dblclick', function(e) {
                e.preventDefault();
            });

            // 键盘空格键支持（辅助功能）
            document.addEventListener('keydown', function(e) {
                if (e.code === 'Space' || e.key === ' ') {
                    e.preventDefault();
                    if (currentState === STATE.RESULT || currentState === STATE.TOO_EARLY) {
                        clearAllTimers();
                        isTransitioning = false;
                        startWaiting();
                    } else if (currentState === STATE.WAITING || currentState === STATE.READY) {
                        handleUserReaction();
                    }
                }
            });

            // 页面卸载时清理计时器
            window.addEventListener('beforeunload', function() {
                clearAllTimers();
            });

            // 处理页面可见性变化（用户切换标签页）
            document.addEventListener('visibilitychange', function() {
                if (document.hidden && currentState === STATE.WAITING) {
                    // 用户切换标签页，取消等待并重置
                    clearAllTimers();
                    isTransitioning = false;
                    updateHint('检测到标签页切换，测试已重置', true);
                    setTimeout(() => {
                        if (currentState === STATE.WAITING || currentState === STATE.TOO_EARLY) {
                            startWaiting();
                        }
                    }, 800);
                    currentState = STATE.TOO_EARLY;
                    updateCircleUI(STATE.TOO_EARLY);
                    updateCircleContent(`
                            <span class="main-text">已重置</span>
                            <span class="sub-text">请勿切换窗口</span>
                        `);
                    tooEarlyTimeout = setTimeout(() => {
                        isTransitioning = false;
                        startWaiting();
                    }, 1200);
                }
            });

            // ============ 初始化 ============
            function init() {
                updateAllStats();
                startWaiting();
            }

            init();

            console.log('⚡ 反射弧测试已就绪');
            console.log('  - 随机等待 1.5~5 秒后屏幕变绿');
            console.log('  - 看到绿色立即点击圆形');
            console.log('  - 也支持按空格键反应');
            console.log('  - 反应时间精确到毫秒');
            console.log('  - 过早点击会触发警告');
            console.log('🏆 祝你取得好成绩！');
        })();
    </script>
</body>
</html>
