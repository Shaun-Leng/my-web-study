    //2.求任意数组最大值
    function getArrValue(arr = []) {
      let max = arr[0]
      let min = arr[0]
      for (let i = 0; i < arr.length; i++) {
        if (max < arr[i]) {
          max = arr[i]
        }
        if (min > arr[i]) {
          min = arr[i]
        }
      }
      return [max, min]
    }
    let newArr = getArrValue([11, 3, 55, 7, 29])
    console.log(newArr[0])
    console.log(newArr[1])
