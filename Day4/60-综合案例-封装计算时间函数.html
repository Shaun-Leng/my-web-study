<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    let second = +prompt('请输入秒数')
    function getTime(t) {
      //console.log(t)
      let h = parseInt(t / 60 / 60 % 24)
      let m = parseInt(t / 60 % 60)
      let s = parseInt(t % 60)
      h < 10 ? '0' + h : h
      m < 10 ? '0' + m : m
      s < 10 ? '0' + s : s
      // console.log(h, m, s)
      return `转换完毕后是${h}时${m}分${s}秒`

    }
    let str = getTime(second)
    document.write(str)
  </script>
</body>

</html>
