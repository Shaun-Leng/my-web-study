<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <textarea name="" id="" cols="30" rows="10">
        用户注册协议
        欢迎注册******************************
        **************************************
        **************************************
    </textarea>
    <br>
    <button class="btn" disabled>已阅读(5)</button>
    <script>
        const btn = document.querySelector('.btn')
        let i = 5
        let n = setInterval(function(){
            i--
            btn.innerHTML = `已阅读(${i})`
            if (i == 0) {
                clearInterval(n)
                btn.disabled = false
                btn.innerHTML = '同意'
            }
        }, 1000)
    </script>
</body>
</html>
