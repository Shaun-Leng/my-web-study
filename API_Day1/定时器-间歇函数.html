<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function fn() {
            console.log('一秒执行一次')
        }
        // setInterval(函数名/匿名函数， 间隔时间（毫秒）)
        let n = setInterval(fn, 1000)
        // 关闭定时器
        clearInterval(n)
    </script>
</body>
</html>
