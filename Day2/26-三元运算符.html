<!DOCTYPE html>
<html lang="en">

<head>

<body>
  <script>
    //1.用户输入
    let num1 = +prompt('请输入一个数')
    let num2 = +prompt('请再输入一个数')
    //2.判断输出
    num1 > num2 ? alert(`最大值是:${num1}`) : alert(`最大值是：${num2}`)
  </script>
</body>
