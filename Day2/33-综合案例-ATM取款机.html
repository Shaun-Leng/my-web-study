<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    //1.开始循环
    let money = 100
    while (true) {
      let re = +prompt(`
      请您选择操作：
      1.存钱
      2.取钱
      3.查看余额
      4.退出
      `)
      //2.如果输入4则退出循环
      if (re === 4) {
        break
      }
      //3.根据输入做操作
      switch (re) {
        case 1:
          //存钱
          let cun = prompt('请输入存款金额')
          money += cun
          break
        case 2:
          //取钱
          let qu = prompt('请输入存款金额')
          money -= qu
          break
        case 3:
          //查余额
          alert(`您的余额为${money}`)
          break
        default:
          alert('输入错误')
      }
    }
  </script>
</body>

</html>
